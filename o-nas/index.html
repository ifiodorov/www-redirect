     тегом, а не запретом в robots.txt - под запретом робот не скачает

<!-- og-теги для мессенджеров. Апекс краулеру Telegram недоступен,

     meta refresh на апекс: краулер уходит по ним и карточка пропадает. -->

<meta property="og:type" content="website"/>
<meta property="og:site_name" content="пРОСТо Финансы"/>
<meta property="og:locale" content="ru_RU"/>
<meta property="og:image" content="https://www.prosto-finance.ru/og-cover-2.png"/>

</script>
</head>
