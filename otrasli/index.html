<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Финансовый учёт под вашу отрасль - пРОСТо Финансы</title>

<!-- Для поиска этой страницы нет: индексируется только апекс. Помечаем
     тегом, а не запретом в robots.txt - под запретом робот не скачает
     страницу и не увидит пометку, а адрес всё равно осядет в индексе
     пустой строкой. Краулеру Telegram этот тег безразличен. -->
<meta name="robots" content="noindex">

<!-- og-теги для мессенджеров. Апекс краулеру Telegram недоступен,
     поэтому карточка строится отсюда. НЕ добавлять canonical и
     meta refresh на апекс: краулер уходит по ним и карточка пропадает. -->
<meta property="og:title" content="Финансовый учёт под вашу отрасль - пРОСТо Финансы"/>
<meta property="og:description" content="Управленческий учёт и финдиректор на аутсорсе с учётом специфики ниши: маркетплейсы, стоматология, опт, ювелирный бизнес, производство. У каждой отрасли своя логика прибыли - настраиваем отчётность под неё."/>
<meta property="og:type" content="website"/>
<meta property="og:image" content="https://www.prosto-finance.ru/og-cover-2.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta property="og:image:alt" content="пРОСТо Финансы - финансовый директор на аутсорсе"/>
<meta property="og:url" content="https://www.prosto-finance.ru/otrasli"/>

<script>
  location.replace("https://prosto-finance.ru/otrasli" + location.search + location.hash);
</script>
</head>
<body>
  <a href="https://prosto-finance.ru/otrasli">Финансовый учёт под вашу отрасль - пРОСТо Финансы</a>
</body>
</html>
